name: backend-ci
on: [push, pull_request]
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore Leads.sln
      - run: dotnet build Leads.sln --configuration Release --no-restore
      - run: dotnet test Leads.sln --configuration Release --no-build
