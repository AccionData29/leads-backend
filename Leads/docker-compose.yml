services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: leads
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  pipeline:
    build: ../pipeline_build
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/leads
      PIPELINE_VERSION: "0.1.0"
      AI_PROVIDER: "mock"
      DATA_DIR: /app/data
    command: ["uvicorn", "pipeline.api:app", "--host", "0.0.0.0", "--port", "8001"]
    ports: ["8001:8001"]
    depends_on: [postgres]
    volumes:
      - ../pipeline_build/data:/app/data

  api:
    build: .
    environment:
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=leads;Username=postgres;Password=postgres
      Pipeline__BaseUrl: http://pipeline:8001
      ASPNETCORE_URLS: http://+:8080
    ports: ["8080:8080"]
    depends_on: [postgres, pipeline]

volumes:
  pgdata:
